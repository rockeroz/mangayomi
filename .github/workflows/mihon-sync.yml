name: Mihon Sync build

on:
  push:
    branches: [mihon-sync]
  workflow_dispatch:

concurrency:
  group: mihon-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Mihon Sync tests
        shell: bash
        run: |
          set -o pipefail
          flutter test test/services/mihon_sync_test.dart test/services/mihon_sync_library_test.dart 2>&1 | tee test.log

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          for f in analyze.log test.log; do
            [ -f "$f" ] || continue
            body=$(grep -v '^\s*$' "$f" | grep -iE 'error|fail|expected|actual|exception|\.dart:[0-9]' | head -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::${body}"
          done

  build-windows:
    name: Build (Windows release)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          body=$(grep -iE 'error|fail' build.log | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build.log::${body}"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-MihonSync-windows
          path: build/windows/x64/runner/Release/
